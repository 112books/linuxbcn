{{ $lang := .Site.Language.Lang }}
{{ with index hugo.Data.faq $lang }}
<section class="faq" aria-labelledby="faq-heading">
  <h2 id="faq-heading">{{ i18n "faq_title" }}</h2>
  {{ range . }}
  <details>
    <summary>{{ .q }}</summary>
    <p>{{ .a | markdownify }}</p>
  </details>
  {{ end }}
</section>
{{ end }}
