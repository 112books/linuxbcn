{{ define "main" }}

<h1>{{ .Title }}</h1>

<div class="search-wrap" data-search="{{ dict "lang" .Site.Language.Lang "indexUrl" (printf "%sindex.json" .Site.Home.RelPermalink) | jsonify }}">
  <label for="search-input" class="visually-hidden">{{ if eq .Site.Language.Lang "ca" }}Cerca{{ else }}Search{{ end }}</label>
  <input
    type="text"
    id="search-input"
    class="search-input"
    placeholder="{{ if eq .Site.Language.Lang "ca" }}Què busques?{{ else }}What are you looking for?{{ end }}"
    autocomplete="off"
    autofocus
  >
  <div class="search-icon">
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" width="18" height="18">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
  </div>
  <div class="search-hint" id="search-hint">
    {{ if eq .Site.Language.Lang "ca" }}
      Escriu per cercar entre projectes, solucions i continguts
    {{ else }}
      Type to search across projects, solutions and content
    {{ end }}
  </div>
</div>

<div id="results" role="status" aria-live="polite"></div>

<script src="{{ "js/cerca.js" | relURL }}" defer></script>

{{ end }}
