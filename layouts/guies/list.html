{{ define "main" }}

<article>
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.subtitle }}<p class="subtitle">{{ . }}</p>{{ end }}
  </header>

  <div class="content">
    {{ .Content }}

    <ul>
      {{ range .Pages.ByWeight }}
      <li>
        <a href="{{ .RelPermalink }}"><strong>{{ .Title }}</strong></a>{{ with .Description }} — {{ . }}{{ end }}
      </li>
      {{ end }}
    </ul>
  </div>
</article>

{{ end }}
