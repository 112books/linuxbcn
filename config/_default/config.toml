[params]
  tagline = "Solucions digitals a mida. Programari lliure, sense complicacions."
  description = "Consultoria d'identitat digital a Barcelona per a artistes, col·lectius culturals i microempreses amb valors. Programari lliure, privacitat i sobirania de dades."
  og_image = "img/og-linuxbcn.png"

[languages.ca.params]
  description = "Consultoria d'identitat digital a Barcelona per a artistes, col·lectius culturals i microempreses amb valors. Programari lliure, privacitat i sobirania de dades."

[languages.en.params]
  description = "Digital identity consultancy for artists, cultural collectives and values-driven micro-businesses. Free software, privacy and data sovereignty."

# Sense taxonomies: sector i serveis són paràmetres simples dels projectes.
# Les pàgines /serveis/ seran una secció real (PLA-SEO-2026-11, fase 2).
[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]