112books-theme:
  - q: "Com clarificar l'arquitectura d'informació d'una editorial?"
    a: "Vam reorganitzar el web en tres pilars clars (catàleg, autors i notícies) i vam construir un tema bloc FSE des de zero, sense plantilles de tercers."
  - q: "Es pot editar el web sense dependre d'un tècnic?"
    a: "Sí: el tema FSE permet editar plantilles i continguts des del mateix WordPress, amb blocs natius."
  - q: "Per què s'ha mantingut WordPress en aquest cas?"
    a: "Vam donar personalitat a un WordPress que tenia el 'look' genèric de qualsevol WordPress pesat. El mantenim per no haver de migrar tot el sistema de cistella virtual, però ara crida l'atenció i acompleix molt millor la seva finalitat."
112books:
  - q: "Com donar presència digital pròpia a una editorial de fotografia?"
    a: "Web propi amb catàleg estructurat i identitat digital, sense dependre de plataformes de tercers."
  - q: "Es perd el control de les dades?"
    a: "No: allotjament i analítica propis, sense cookies ni serveis externs."
112revelats:
  - q: "Es pot tenir un web de fotografia sense base de dades?"
    a: "Sí: web estàtic a GitHub Pages, sense dependències i amb càrrega immediata."
  - q: "Es veurà bé en mòbil?"
    a: "Sí: disseny lleuger i adaptatiu, amb imatges optimitzades."
9-barris-acull:
  - q: "Com gestionar expedients de forma segura i compliant amb el RGPD?"
    a: "Aplicació Drupal a mida amb control d'accés i tractament de dades conforme al RGPD."
  - q: "Com obtenir estadístiques sense comprometre dades personals?"
    a: "Informes agregats i anonimitzats generats des de la mateixa aplicació."
app-estenop:
  - q: "Es pot calcular l'exposició d'una càmera pinhole sense taules?"
    a: "Sí: Estenop fa servir la càmera del mòbil com a fotòmetre i aplica la correcció de reciprocitat."
  - q: "Funciona sense connexió i sense enviar dades?"
    a: "Sí: és offline i no surt cap dada del dispositiu."
  - q: "Es pot mesurar la llum amb el mòbil?"
    a: "Estenop és una alternativa per mesurar la llum des del telèfon. Encara en fase beta: falta polir-la, perquè molts telèfons no permeten a les webapps accedir a tota la seva potència."
app-positivador:
  - q: "Es pot veure un negatiu en positiu en temps real?"
    a: "Sí, amb la càmera del dispositiu i processament local, sense servidor."
  - q: "Cal instal·lar res?"
    a: "No: funciona directament al navegador."
awpcp:
  - q: "Com donar visibilitat a una comunitat internacional de fotografia?"
    a: "Web lleuger allotjat a GitHub Pages, sense base de dades."
  - q: "Es pot mantenir fàcilment?"
    a: "Sí: contingut estàtic i desplegament senzill."
blog-pocallum:
  - q: "Com migrar 2.353 posts de Blogger a Hugo sense perdre URLs?"
    a: "Vam conservar totes les URLs amb paritat 1:1 i vam eliminar la base de dades i les dependències."
  - q: "Es perd el contingut històric?"
    a: "No: 137.000 paraules i 71 comentaris llegats es conserven."
  - q: "Què més s'hi guanya?"
    a: "Més sobirania de dades: el contingut és propi i viu al nostre servidor. Podem publicar les entrades al blog sense cap restricció i amb una optimització SEO a mida."
  - q: "Quin gestor de continguts hi ha darrere?"
    a: "Un CMS a mida amb les funcionalitats justes —ni més ni menys—. És més lleuger, més segur i està fet al gust de qui l'ha de fer servir cada dia."
bratia:
  - q: "Com migrar el web d'una banda de WordPress a Hugo?"
    a: "Migració a un sistema estàtic, multilingüe i autònom, amb agenda i discografia integrades."
  - q: "La banda pot actualitzar el contingut?"
    a: "Sí, amb un gestor de continguts senzill."
carrer:
  - q: "Com digitalitzar una publicació veïnal?"
    a: "Web i comunicació digital per a la revista, amb contingut gestionable."
  - q: "Es pot publicar sense dependències?"
    a: "Sí, amb programari lliure i allotjament propi."
cuida:
  - q: "Com coordinar les cures d'un malalt a casa?"
    a: "App amb contactes mèdics, medicació, protocols d'urgència i horaris de cuidadors."
  - q: "És accessible i de codi obert?"
    a: "Sí: WCAG AA i codi obert."
  - q: "Què fa, exactament, Cuida?"
    a: "És una app pensada per ajudar els cuidadors en la cura dels seus malalts: una eina molt pràctica i feta totalment de zero."
family-art-tattoo:
  - q: "Com millorar la presència digital d'un estudi de tatuatge?"
    a: "Tema WordPress a mida, continguts i SEO, amb integració a Instagram."
  - q: "Es pot gestionar des del mòbil?"
    a: "Sí: disseny adaptatiu i fàcil d'editar."
favb:
  - q: "Com dotar de presència digital una federació de veïns?"
    a: "Web i comunicació digital per a l'organització, amb contingut gestionable."
  - q: "Es respecta la sobirania de dades?"
    a: "Sí: allotjament propi i cap servei de tercers."
gestor-hores:
  - q: "Com saber quantes hores dediques a cada projecte?"
    a: "Registre automàtic per sessió, amb reports visuals i sincronització via Codeberg."
  - q: "Cal introduir les dades a mà?"
    a: "No: el registre és automàtic."
goatcounter-dashboard:
  - q: "Com tenir estadístiques sense cookies ni Google?"
    a: "Dashboard self-hosted sobre l'API de GoatCounter, respectuós amb la privacitat."
  - q: "Es pot auditar?"
    a: "Sí: és programari lliure."
  - q: "Què aporta respecte del GoatCounter original?"
    a: "Usa les dades que GoatCounter recopila —respectant la privacitat— i les presenta d'una forma més entenedora i eficient."
konsento:
  - q: "Com prendre decisions col·lectives de forma transparent?"
    a: "Aplicació de governança assembleària per a cooperatives i espais autogestionats."
  - q: "És accessible?"
    a: "Sí: pensada per a ús col·lectiu i conforme a WCAG."
  - q: "Funciona en un espai amb gent molt diversa?"
    a: "Sí: hem aconseguit un programari resolutiu i lleuger, que funciona en un servidor molt modest i permet una gestió integral de la governança d'un espai on conviu un grup ampli de persones molt diferents."
LinuxBCN-Analytics-for-GoatCounter:
  - q: "Com integrar analítica sense cookies a WordPress?"
    a: "Plugin de codi obert que connecta GoatCounter amb el tauler de WordPress."
  - q: "Cal Google Analytics?"
    a: "No: no se'n depèn en cap moment."
  - q: "Calen 2 GB al servidor per saber qui et visita?"
    a: "Amb el sistema mastodòntic de Google, sí. Amb LinuxBCN Analytics for GoatCounter no: el WordPress va molt més lleuger i no s'usen les dades dels usuaris."
linuxbcn-arquitectura-sistema-digital:
  - q: "Com construir el web d'una consultoria sense dependències?"
    a: "Hugo a mida, bilingüe i lleuger: el mateix sistema que apliquem als clients."
  - q: "Es pot mantenir sense agència?"
    a: "Sí: contingut estàtic i desplegament propi."
llumatics:
  - q: "Com donar presència digital a un projecte de fotografia analògica?"
    a: "Web i gestió de continguts amb programari lliure."
  - q: "Es poden mostrar les imatges sense dependències?"
    a: "Sí: imatges optimitzades i allotjament propi."
machiroku:
  - q: "Com modernitzar el web d'un restaurant?"
    a: "Redisseny ràpid, mòbil i fàcil de gestionar, sense dependències externes."
  - q: "Es pot actualitzar la carta fàcilment?"
    a: "Sí, amb un gestor de continguts senzill."
malditasmaquinas:
  - q: "Com vendre serveis de consultoria per hores en línia?"
    a: "WebApp SPA amb Stripe i notificacions per Telegram, multidioma i WCAG AA."
  - q: "Es poden cobrar pagaments de forma segura?"
    a: "Sí, amb Stripe."
migracio-blogger-9barrisimatge:
  - q: "Com migrar 3.006 articles de Blogger sense errors?"
    a: "Migració a Taro Photo App amb zero errors i URLs conservades."
  - q: "Es perd el contingut des del 2008?"
    a: "No: tot l'històric es conserva."
  - q: "Quin gestor de continguts hi ha darrere?"
    a: "Un CMS a mida amb les funcionalitats justes —ni més ni menys—. És més lleuger, més segur i està fet al gust de qui l'ha de fer servir cada dia."
nau-bostik:
  - q: "Com recuperar el web d'un espai cultural?"
    a: "Recuperació d'urgència i replantejament digital, amb allotjament i correu."
  - q: "El col·lectiu pot gestionar-lo?"
    a: "Sí: eines que el col·lectiu pot mantenir."
pocallum-estatic:
  - q: "Com passar un web de WordPress a estàtic?"
    a: "Migració a Hugo: zero dependències i càrrega instantània."
  - q: "Es mantenen les URLs?"
    a: "Sí, amb paritat total."
  - q: "Quin gestor de continguts hi ha darrere?"
    a: "Un CMS a mida amb les funcionalitats justes —ni més ni menys—. És més lleuger, més segur i està fet al gust de qui l'ha de fer servir cada dia."
pocallum:
  - q: "Com crear el portfolio digital d'una agència fotogràfica?"
    a: "Web i presència digital amb programari lliure."
  - q: "Es poden gestionar les galeries?"
    a: "Sí, amb un gestor senzill."
  - q: "Què és el més important en un web de fotografia?"
    a: "A Pocallum la imatge ho és tot, però el web havia de ser igualment lleuger: qualitat visual sense renunciar a la velocitat."
ressona:
  - q: "Com construir la identitat digital d'un artista?"
    a: "Plataforma amb identitat visual, press kit, web i comunicació."
  - q: "Es pot actualitzar?"
    a: "Sí: contingut gestionable i allotjament propi."
  - q: "Què hi troba un músic o professional del sector?"
    a: "Un fons d'eines pensat per a músics i professionals. Ressona ja és un referent per a la indústria musical catalana."
taro-photo-app:
  - q: "Com gestionar una associació fotogràfica sense plataformes tancades?"
    a: "Web estàtic, gestor Sveltia i mòduls de votació, formularis i autopublicació (AGPL-3.0)."
  - q: "Es poden migrar els continguts antics?"
    a: "Sí: importació de Blogger i 3.008 articles."
terra-i-foc:
  - q: "Com crear un web bilingüe per a un obrador artesà?"
    a: "Web estàtica amb Hugo, GitHub Pages i GoatCounter sense cookies."
  - q: "És ràpid i sense dependències?"
    a: "Sí: càrrega instantània i zero dependències."
  - q: "Per què una web tan mínima?"
    a: "Terra i Foc és un exemple de web mínima: per a un projecte artesà no cal res més. Quan el menys és més!"
votacio-public:
  - q: "Com fer una votació presencial sense recollir dades personals?"
    a: "Un vot per obra i mòbil, només dins de la sala, sense guardar coordenades ni dades personals."
  - q: "Es pot verificar el recompte?"
    a: "Sí: signatura HMAC i recompte verificable (també en paper)."
